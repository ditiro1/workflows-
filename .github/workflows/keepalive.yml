name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: "0 9 * * *"      # daily at 09:00 UTC (safer than every 2 days)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping /api/public/mt5/logs
        env:
          API_KEY: ${{ secrets.MT5_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Secret MT5_API_KEY is empty or not set as a repository secret"
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            http_code=$(curl -s -o response.json -w "%{http_code}" \
              --max-time 30 \
              -A "github-actions-keepalive/1.0" \
              -H "X-Api-Key: $API_KEY" \
              "https://www.lakeinnfeedlot.com/api/public/mt5/logs?since=0") || http_code=000

            echo "Attempt $attempt: HTTP status $http_code"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Keep-alive ping succeeded"
              exit 0
            fi

            head -c 500 response.json 2>/dev/null; echo
            sleep 20
          done

          echo "::error::Keep-alive ping failed after 5 attempts (last status $http_code)"
          exit 1
