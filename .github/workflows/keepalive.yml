name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: "0 9 * * *"     # daily 09:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping /api/public/mt5/logs
        env:
          RAW_KEY: ${{ secrets.MT5_API_KEY }}
        run: |
          # strip spaces, CR/LF, and surrounding quotes
          API_KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]"'"'"'')
          echo "Key length after cleanup: ${#API_KEY} (raw: ${#RAW_KEY})"
          if [ -z "$API_KEY" ]; then
            echo "::error::MT5_API_KEY secret is empty or not a repository secret"
            exit 1
          fi

          for attempt in 1 2 3; do
            http_code=$(curl -s -o response.json -w "%{http_code}" \
              --max-time 30 \
              -H "X-Api-Key: $API_KEY" \
              "https://www.lakeinnfeedlot.com/api/public/mt5/logs?since=0") || http_code=000
            echo "Attempt $attempt: HTTP $http_code"
            head -c 300 response.json 2>/dev/null; echo

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Keep-alive OK"; exit 0
            fi
            # 4xx = request/key problem, retrying won't help
            if [ "$http_code" -ge 400 ] && [ "$http_code" -lt 500 ]; then
              echo "::error::Client error $http_code (check MT5_API_KEY value)"; exit 1
            fi
            sleep 20
          done
          echo "::error::Ping failed after 3 attempts"; exit 1
