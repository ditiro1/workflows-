
name: Supabase Keep-Alive Ping

# Sends a real API request every two days
# to prevent Supabase inactivity pausing.

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04

    steps:
      - name: Ping Lakeinn Feedlot MT5 API
        env:
          MT5_API_KEY: ${{ secrets.MT5_API_KEY }}

        run: |
          set +e

          echo "Starting Supabase Keep-Alive Ping..."

          http_code=$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 45 \
            -o response.json \
            -w "%{http_code}" \
            -H "X-Api-Key: $MT5_API_KEY" \
            "https://www.lakeinnfeedlot.com/api/public/mt5/logs?since=0")

          curl_exit=$?

          echo "Curl exit code: $curl_exit"
          echo "HTTP status: $http_code"

          if [ -f response.json ]; then
            echo "API response:"
            head -c 4000 response.json
            echo
          fi

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::API connection failed"
            exit 1
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::API returned HTTP $http_code"
            exit 1
          fi

          echo "Supabase Keep-Alive Ping successful!"
r::Keep-alive ping failed with status $http_code"
            exit 1
          fi
