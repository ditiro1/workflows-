name: Lakeinnfeedlot Cloud Keep-Alive
on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloud trading session
        env:
          MT5_API_KEY: ${{ secrets.MT5_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 2 \
            -X POST -H "X-Api-Key: $MT5_API_KEY" \
            "https://www.lakeinnfeedlot.com/api/public/mt5/session")
          echo "HTTP status: $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || exit 1
