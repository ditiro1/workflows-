name: Supabase Keep-Alive Ping

# Hits the existing /logs endpoint every 2 days so the Supabase project
# always has real API traffic and never crosses the 7-day inactivity
# threshold. Remove this workflow once you're on Supabase Pro (pausing no
# longer applies there).

on:
  schedule:
    - cron: "0 9 */2 * *"   # 09:00 UTC, every 2 days
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-26.04.1
    timeout-minutes: 5
    steps:
      - name: Ping /api/public/mt5/logs
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.MT5_API_KEY }}" \
            "https://www.lakeinnfeedlot.com/api/public/mt5/logs?since=0")

          echo "HTTP status: $http_code"
          cat response.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Keep-alive ping failed with status $http_code"
            exit 1
          fi
